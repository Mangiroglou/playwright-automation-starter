name: Playwright Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  playwright-tests:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test

      - name: Publish Playwright test summary
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'test-results/results.json';
          const summaryFile = process.env.GITHUB_STEP_SUMMARY;

          if (!fs.existsSync(file)) {
            fs.appendFileSync(summaryFile, '## Playwright Test Results\n\nNo JSON results were generated.\n');
            process.exit(0);
          }

          const report = JSON.parse(fs.readFileSync(file, 'utf8'));
          const stats = report.stats ?? {};
          const rows = [
            '## Playwright Test Results',
            '',
            '| Result | Count |',
            '| --- | ---: |',
            `| Passed | ${stats.expected ?? 0} |`,
            `| Failed | ${stats.unexpected ?? 0} |`,
            `| Flaky | ${stats.flaky ?? 0} |`,
            `| Skipped | ${stats.skipped ?? 0} |`,
            '',
            `**Duration:** ${((stats.duration ?? 0) / 1000).toFixed(1)} seconds`,
          ];

          fs.appendFileSync(summaryFile, rows.join('\n') + '\n');
          NODE

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore